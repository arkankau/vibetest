[project]
name = "vibetest"
version = "0.1.0"
description = "AI agent for executing natural language test cases over arbitrary codebases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.0",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]

[project.scripts]
vibetest = "vibetest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
