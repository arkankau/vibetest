[project]
name = "vibetest"
version = "0.1.0"
description = "AI agent for executing natural language test cases over arbitrary codebases"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspect-ai>=0.3.157",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "numpy<2",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "nltk>=3.8.1",
    "torchtext==0.18.0+cpu",
    "traincheck @ git+https://github.com/OrderLab/TrainCheck@43b7984c2e3a9719cae853e09246f9229ebcbfdf",
    "tensorflow>=2.20",
    "keras>=3.13",
    "tqdm>=4.66",
    "transformers>=4.40",
    "datasets>=2.19",
    "sentence-transformers>=2.7",
    "tokenizers>=0.15",
    "spacy>=3.7",
    "gensim>=4.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "wordcloud>=1.9",
    "beautifulsoup4>=4.12",
    "plotly>=5.20",
    "wandb>=0.16",
    "ray>=2.10",
    "optuna>=3.6",
    "imbalanced-learn>=0.12",
    "pytorch-pretrained-bert>=0.6",
    "accelerate>=0.29",
    "catalyst>=22.4",
    "folium>=0.16",
    "sympy>=1.12",
    "fastai>=2.7",
    "torch==2.3.1+cpu",
    "torchvision==0.18.1+cpu",
    "torchaudio==2.3.1+cpu",
    "arxiv>=1.4.8",
    "pypdf>=6.6.2",
    "pdfplumber>=0.11.9",
    "bibtexparser>=1.4.4",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.3",
    "nbdime>=4.0.4",
    "inspect-swe>=0.2.41",
]

[project.scripts]
vibetest = "vibetest.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff]
# Set the maximum line length to 100 characters
line-length = 100

# Target Python 3.12+
target-version = "py312"

[tool.ruff.lint]
# Enable recommended rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules if needed
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line ending
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["vibetest"]
# Include Docker configuration files in the package
include = [
    "Dockerfile",
    "compose.yaml",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
