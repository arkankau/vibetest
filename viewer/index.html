<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibetest Results Viewer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #1f2328;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.5rem 2rem 1rem;
        border-bottom: 1px solid #e3e8f0;
        background: #fff;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      header p {
        margin: 0.5rem 0 0;
        color: #5c6370;
      }

      .log-selector {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }

      .log-selector label {
        font-size: 0.85rem;
        font-weight: 500;
        color: #374151;
      }

      .log-selector select {
        border: 1px solid #dde2eb;
        background: #fff;
        border-radius: 8px;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        cursor: pointer;
        min-width: 250px;
      }

      .log-selector select:hover {
        border-color: #b9c3d8;
      }

      .log-selector select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .log-stats {
        font-size: 0.85rem;
        color: #6c7280;
        margin-left: 1rem;
      }

      .file-picker {
        margin-left: auto;
      }

      .file-picker input[type="file"] {
        display: none;
      }

      .file-picker label {
        border: 1px solid #dde2eb;
        background: #fff;
        border-radius: 8px;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 120ms ease;
      }

      .file-picker label:hover {
        border-color: #2563eb;
        background: #eef2ff;
      }

      .loading-indicator {
        font-size: 0.85rem;
        color: #6c7280;
        font-style: italic;
      }

      main {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 1.5rem;
        padding: 1.5rem 2rem 2rem;
        flex: 1;
        min-height: 0;
      }

      aside {
        background: #fff;
        border-radius: 16px;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      section {
        background: #fff;
        border-radius: 16px;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .tests-pane {
        display: grid;
        grid-template-columns: minmax(280px, 350px) 1fr;
        height: 100%;
        gap: 1.25rem;
        min-height: 0;
        flex: 1;
      }

      .tests-column {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      #repo-list,
      #test-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        overflow-y: auto;
        padding-right: 0.25rem;
        flex: 1;
      }

      .list-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #5c6370;
        margin-bottom: 0.5rem;
        flex-shrink: 0;
      }

      button.list-item {
        border: 1px solid #dde2eb;
        background: #fff;
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        text-align: left;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 120ms ease;
        flex-shrink: 0;
      }

      button.list-item:hover {
        border-color: #b9c3d8;
      }

      button.list-item.active {
        border-color: #2563eb;
        background: #e3ecff;
      }

      .repo-meta, .test-meta {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.35rem;
        font-size: 0.75rem;
        color: #6c7280;
      }

      .status-pill {
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        background: #e5f6ef;
        color: #0e8054;
      }

      .status-pill.pass {
        background: #e5f6ef;
        color: #0e8054;
      }

      .status-pill.fail {
        background: #fde2e1;
        color: #c53030;
      }

      .status-pill.na {
        background: #fef3c7;
        color: #92400e;
      }

      .status-pill.inconclusive {
        background: #ede9fe;
        color: #5b21b6;
      }

      .status-pill.unknown {
        background: #e5e7eb;
        color: #4b5563;
      }

      #test-details {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      #selected-test-name {
        margin: 0;
        font-size: 1.1rem;
        flex-shrink: 0;
      }

      #test-summary {
        margin-top: 1rem;
        overflow-y: auto;
        flex: 1;
      }

      .summary-grid {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .summary-card {
        border: 1px solid #e3e8f0;
        border-radius: 12px;
        padding: 0.9rem;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .summary-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c7280;
      }

      .summary-card p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .summary-card p + p {
        margin-top: 0.5rem;
      }

      .citation-button {
        border: 1px solid #d0d7e3;
        background: #fff;
        border-radius: 999px;
        padding: 0.1rem 0.55rem;
        font-size: 0.75rem;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        cursor: pointer;
        margin: 0 0.2rem;
        transition: border-color 120ms ease, background 120ms ease;
      }

      .citation-button:hover {
        border-color: #2563eb;
        background: #eef2ff;
      }

      .citation-button.loading {
        opacity: 0.6;
        cursor: progress;
      }

      .citation-snippet {
        border: 1px solid #dbe1ec;
        border-radius: 10px;
        background: #f8fafc;
        margin-top: 0.6rem;
        padding: 0.75rem;
        font-size: 0.85rem;
      }

      .citation-snippet pre {
        margin: 0.4rem 0 0;
        background: #0f172a;
        color: #f8fafc;
        border-radius: 8px;
        padding: 0.75rem;
        overflow-x: auto;
        font-size: 0.75rem;
      }

      .citation-snippet code {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .snippet-meta {
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #475569;
      }

      .citation-snippet.error {
        border-color: #fecaca;
        background: #fff1f2;
        color: #b91c1c;
      }

      #empty-state {
        color: #6c7280;
        font-size: 0.85rem;
        margin: 0.5rem 0 0;
        font-style: italic;
      }

      footer {
        padding: 1rem 2rem;
        font-size: 0.85rem;
        color: #8c92a3;
        border-top: 1px solid #e3e8f0;
        background: #fff;
      }

      @media (max-width: 1100px) {
        main {
          grid-template-columns: 1fr;
        }

        .tests-pane {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Agent Run Viewer</h1>
      <p>View and inspect agent evaluation results from .eval log files.</p>
      <div class="log-selector">
        <label for="log-select">Eval Log:</label>
        <select id="log-select"></select>
        <span class="log-stats" id="log-stats"></span>
        <div class="file-picker">
          <input type="file" id="file-input" accept=".eval" multiple />
          <label for="file-input">📂 Open .eval files...</label>
        </div>
      </div>
    </header>
    <main>
      <aside>
        <div class="list-label">Repositories</div>
        <div id="repo-list"></div>
      </aside>
      <section class="tests-pane">
        <div class="tests-column">
          <div class="list-label">Tests</div>
          <div id="test-list"></div>
          <p id="empty-state">Select a repository to view its tests.</p>
        </div>
        <div id="test-details">
          <h2 id="selected-test-name">Pick a test to see its reasoning</h2>
          <div id="test-summary" class="summary-grid" hidden></div>
        </div>
      </section>
    </main>
    <footer id="footer">Data source: .eval logs</footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script>
      const EVAL_DATA_URL = "eval-results.json";
      const REPO_PATHS_URL = "repo-paths.json";

      const logSelect = document.getElementById("log-select");
      const logStats = document.getElementById("log-stats");
      const repoList = document.getElementById("repo-list");
      const testList = document.getElementById("test-list");
      const emptyState = document.getElementById("empty-state");
      const selectedTestName = document.getElementById("selected-test-name");
      const testSummary = document.getElementById("test-summary");
      const footer = document.getElementById("footer");
      const fileInput = document.getElementById("file-input");

      const sanitizeOptions = {
        ADD_TAGS: ["button"],
        ADD_ATTR: ["data-path", "data-lines", "data-section", "type"],
      };

      const citationCache = new Map();
      const bundleCache = new Map();
      const textDecoder = new TextDecoder();

      let repoPaths = {};
      let logs = [];
      let selectedLogIndex = 0;
      let selectedRepoIndex = null;
      let selectedTestIndex = null;

      // ========== .eval file parsing functions ==========

      function getModelFolder(modelName) {
        if (modelName.startsWith("gpt-5-mini")) return "gpt-5-mini";
        if (modelName.startsWith("gpt-5-nano")) return "gpt-5-nano";
        if (modelName.startsWith("gpt-5.2")) return "gpt-5.2";
        if (modelName.startsWith("gpt-5")) return "gpt-5";
        return "gpt-5";
      }

      function extractRepoNameFromSampleId(sampleId) {
        if (sampleId.includes("_prop")) {
          return sampleId.split("_prop")[0];
        }
        if (sampleId.includes("_")) {
          const parts = sampleId.split("_");
          parts.pop();
          return parts.join("_");
        }
        return sampleId;
      }

      function extractPropIndexFromSampleId(sampleId) {
        const match = sampleId.match(/_prop(\d+)$/);
        if (match) {
          return parseInt(match[1], 10);
        }
        // Fallback: try to extract trailing number after underscore
        const fallbackMatch = sampleId.match(/_(\d+)$/);
        if (fallbackMatch) {
          return parseInt(fallbackMatch[1], 10);
        }
        return 0;
      }

      function flattenMessageContent(content) {
        if (typeof content === "string") return content;
        if (content && typeof content === "object" && !Array.isArray(content)) {
          return content.text || "";
        }
        if (Array.isArray(content)) {
          return content.map(flattenMessageContent).join("\n");
        }
        return "";
      }

      function parseSections(text) {
        const sections = { verdict: [], reason: [], evidence: [] };
        let current = null;
        const sectionPattern = /^(VERDICT|REASON|EVIDENCE)\s*:\s*(.*)$/i;

        for (const line of text.split(/\r?\n/)) {
          const match = line.match(sectionPattern);
          if (match) {
            current = match[1].toLowerCase();
            const remainder = match[2].trim();
            if (remainder) sections[current].push(remainder);
          } else if (current) {
            sections[current].push(line);
          }
        }

        return {
          verdict: sections.verdict.join("\n").trim(),
          reason: sections.reason.join("\n").trim(),
          evidence: sections.evidence.join("\n").trim(),
        };
      }

      function extractSectionsFromMessages(messages) {
        for (let i = messages.length - 1; i >= 0; i--) {
          const text = flattenMessageContent(messages[i].content);
          if (!text.includes("VERDICT")) continue;
          const sections = parseSections(text);
          sections.fullText = text;
          return sections;
        }
        return { verdict: "", reason: "", evidence: "", fullText: "" };
      }

      function extractTestDescription(inputText) {
        if (!inputText) return "";
        const match = inputText.match(/Test:\s*([\s\S]*?)(?:\nRepository:|\Z)/);
        return match ? match[1].trim() : "";
      }

      function extractRepoPath(inputText) {
        if (!inputText) return "";
        const match = inputText.match(/Repository:\s*(.*)(?:\n|$)/);
        return match ? match[1].trim() : "";
      }

      function extractEvidenceBundles(sample, modelFolder) {
        const bundles = new Set();
        const pattern = /evidence-[\w.-]+\.tar\.gz/gi;

        function scan(value) {
          if (typeof value === "string") {
            const matches = value.match(pattern);
            if (matches) matches.forEach(m => bundles.add(m));
          } else if (Array.isArray(value)) {
            value.forEach(scan);
          } else if (value && typeof value === "object") {
            Object.values(value).forEach(scan);
          }
        }

        scan(sample.events || []);
        scan(sample.attachments || {});

        return Array.from(bundles).sort().map(name => "evidence-dumps/" + modelFolder + "/" + name);
      }

      function verdictToBool(verdictText) {
        return verdictText.toUpperCase().startsWith("PASS");
      }

      function aggregateSamples(samples, evalSource) {
        const repos = {};

        for (const sample of samples) {
          const sampleId = sample.id || "unknown-id";
          const repoName = extractRepoNameFromSampleId(sampleId);
          const propIndex = extractPropIndexFromSampleId(sampleId);
          const repoPath = extractRepoPath(sample.input || "");
          const sections = extractSectionsFromMessages(sample.messages || []);
          const verdictLine = sections.verdict || "";
          const passed = verdictToBool(verdictLine);
          const modelName = (sample.output || {}).model || "unknown";
          const modelFolder = getModelFolder(modelName);
          const evidenceBundles = extractEvidenceBundles(sample, modelFolder);
          const testDescription = extractTestDescription(sample.input || "");

          if (!repos[repoName]) {
            repos[repoName] = {
              repo: repoName,
              repo_name: repoName,
              repo_slug: repoName,
              tests: [],
              total_tests: 0,
              passed_tests: 0,
              failed_tests: 0,
            };
          }

          const testPayload = {
            description: sections.fullText || "",
            sections: {
              verdict: sections.verdict || "",
              reason: sections.reason || "",
              evidence: sections.evidence || "",
            },
            passed: passed,
            metadata: {
              test_description: testDescription,
              sample_id: sampleId,
              prop_index: propIndex,
              repo_path: repoPath,
              model: modelName,
              eval_source: evalSource,
            },
            evidenceBundles: evidenceBundles,
          };

          const repoEntry = repos[repoName];
          repoEntry.tests.push(testPayload);
          repoEntry.total_tests++;
          if (passed) {
            repoEntry.passed_tests++;
          } else {
            repoEntry.failed_tests++;
          }
        }

        // Sort tests within each repo by prop_index
        for (const repo of Object.values(repos)) {
          repo.tests.sort((a, b) => {
            const indexA = a.metadata?.prop_index ?? 0;
            const indexB = b.metadata?.prop_index ?? 0;
            return indexA - indexB;
          });
        }

        const ordered = Object.values(repos).sort((a, b) =>
          (a.repo_name || a.repo).localeCompare(b.repo_name || b.repo)
        );
        return ordered;
      }

      async function parseEvalFile(file) {
        const arrayBuffer = await file.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const unzipped = fflate.unzipSync(data);
        const samples = [];

        for (const [name, content] of Object.entries(unzipped)) {
          if (name.startsWith("samples/") && name.endsWith(".json")) {
            try {
              const text = textDecoder.decode(content);
              samples.push(JSON.parse(text));
            } catch (e) {
              console.warn("Failed to parse sample:", name, e);
            }
          }
        }

        const evalName = file.name.replace(/\.eval$/, "");
        const repos = aggregateSamples(samples, evalName);
        return {
          name: evalName,
          path: file.name,
          repos: repos,
        };
      }

      async function fetchAndParseEvalUrl(evalPath) {
        const response = await fetch(buildAssetURL(evalPath));
        if (!response.ok) {
          throw new Error("Failed to fetch " + evalPath + " (" + response.status + ")");
        }
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const unzipped = fflate.unzipSync(data);
        const samples = [];

        for (const [name, content] of Object.entries(unzipped)) {
          if (name.startsWith("samples/") && name.endsWith(".json")) {
            try {
              const text = textDecoder.decode(content);
              samples.push(JSON.parse(text));
            } catch (e) {
              console.warn("Failed to parse sample:", name, e);
            }
          }
        }

        const evalName = evalPath.split("/").pop().replace(/\.eval$/, "");
        const repos = aggregateSamples(samples, evalName);
        return {
          name: evalName,
          path: evalPath,
          repos: repos,
        };
      }

      // ========== URL parameter handling ==========

      function getEvalPathsFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.getAll("eval");
      }

      // ========== UI helper functions ==========

      function formatTestName(test, index) {
        return (
          test?.metadata?.test_description ||
          test?.metadata?.name ||
          "Test " + (index + 1)
        );
      }

      function parseDescriptionSections(description) {
        const lines = (description || "").split(/\r?\n/);
        const sectionMap = {
          VERDICT: "verdict",
          REASON: "reason",
          EVIDENCE: "evidence",
        };
        const buffers = {
          verdict: [],
          reason: [],
          evidence: [],
        };
        let current = null;

        lines.forEach((line) => {
          const match = line.match(/^([A-Z ]+):\s*(.*)$/);
          if (match && sectionMap[match[1]]) {
            current = sectionMap[match[1]];
            if (match[2]) {
              buffers[current].push(match[2]);
            }
            return;
          }
          if (current) {
            buffers[current].push(line);
          }
        });

        return {
          verdict: buffers.verdict.join("\n").trim(),
          reason: buffers.reason.join("\n").trim(),
          evidence: buffers.evidence.join("\n").trim(),
        };
      }

      function determineStatus(structured, fallbackPassed) {
        const rawVerdict = (structured.verdict || "")
          .split(/\n/)[0]
          .trim()
          .toUpperCase();

        const verdictMap = [
          { matcher: (text) => text.startsWith("PASS"), label: "Pass", className: "pass" },
          { matcher: (text) => text.startsWith("FAIL"), label: "Fail", className: "fail" },
          {
            matcher: (text) => text.startsWith("NA") || text.includes("NOT APPLICABLE"),
            label: "N/A",
            className: "na",
          },
          {
            matcher: (text) => text.startsWith("INCONCLUSIVE"),
            label: "Inconclusive",
            className: "inconclusive",
          },
        ];

        if (rawVerdict) {
          const hit = verdictMap.find((entry) => entry.matcher(rawVerdict));
          if (hit) {
            return hit;
          }
        }

        if (fallbackPassed === true) {
          return { label: "Pass", className: "pass" };
        }
        if (fallbackPassed === false) {
          return { label: "Fail", className: "fail" };
        }
        return { label: "Unknown", className: "unknown" };
      }

      function getCurrentLog() {
        return logs[selectedLogIndex] || null;
      }

      function getCurrentRepos() {
        const log = getCurrentLog();
        return log?.repos || [];
      }

      function renderLogSelector() {
        logSelect.innerHTML = "";
        logs.forEach((log, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = log.name;
          option.selected = index === selectedLogIndex;
          logSelect.appendChild(option);
        });

        logSelect.onchange = (e) => {
          selectedLogIndex = parseInt(e.target.value, 10);
          selectedRepoIndex = null;
          selectedTestIndex = null;
          renderAll();
        };

        updateLogStats();
      }

      function updateLogStats() {
        const log = getCurrentLog();
        if (!log) {
          logStats.textContent = "";
          return;
        }
        const repos = log.repos || [];
        const totalTests = repos.reduce((sum, r) => sum + r.total_tests, 0);
        const passedTests = repos.reduce((sum, r) => sum + r.passed_tests, 0);
        logStats.textContent = repos.length + " repos · " + totalTests + " tests · " + passedTests + " passed";
      }

      function renderRepos() {
        repoList.innerHTML = "";
        const repos = getCurrentRepos();

        repos.forEach((repo, index) => {
          const button = document.createElement("button");
          button.className = "list-item" + (selectedRepoIndex === index ? " active" : "");
          button.innerHTML =
            '<div>' + (repo.repo_name || repo.repo) + '</div>' +
            '<div class="repo-meta">' +
              '<span>' + repo.total_tests + ' tests</span>' +
              '<span>' + repo.passed_tests + '✓ / ' + repo.failed_tests + '✕</span>' +
            '</div>';
          button.addEventListener("click", () => {
            selectedRepoIndex = index;
            selectedTestIndex = null;
            renderRepos();
            renderTests();
            renderDetails();
          });
          repoList.appendChild(button);
        });
      }

      function renderTests() {
        testList.innerHTML = "";
        const repos = getCurrentRepos();

        if (selectedRepoIndex === null) {
          emptyState.textContent = "Select a repository to view its tests.";
          emptyState.style.display = "block";
          selectedTestName.textContent = "Pick a test to see its reasoning";
          testSummary.hidden = true;
          testSummary.innerHTML = "";
          return;
        }

        const repo = repos[selectedRepoIndex];
        if (!repo) {
          emptyState.textContent = "Repository not found.";
          emptyState.style.display = "block";
          return;
        }

        emptyState.style.display = repo.tests.length ? "none" : "block";
        emptyState.textContent = repo.tests.length
          ? ""
          : "This repository has no recorded tests.";

        repo.tests.forEach((test, index) => {
          const structured = getStructuredSections(test);
          const status = determineStatus(structured, test.passed);
          const button = document.createElement("button");
          button.className = "list-item" + (selectedTestIndex === index ? " active" : "");
          button.innerHTML =
            '<div>' + formatTestName(test, index) + '</div>' +
            '<div class="test-meta">' +
              '<span class="status-pill ' + status.className + '">' + status.label + '</span>' +
            '</div>';
          button.addEventListener("click", () => {
            selectedTestIndex = index;
            renderTests();
            renderDetails();
          });
          testList.appendChild(button);
        });

        if (selectedTestIndex === null) {
          selectedTestName.textContent = "Pick a test to see its reasoning";
          testSummary.hidden = true;
          testSummary.innerHTML = "";
        }
      }

      function decorateEvidenceMarkdown(text) {
        if (!text) {
          return "";
        }
        // Match citations in formats:
        // [/path/file.py:10-20] - line range
        // [/path/file.py:10, 20, 30] - comma-separated lines
        // [/path/file.py:10] - single line
        // [/path/file.py] - whole file
        return text.replace(/\[\s*(\/[^\r\n\[\]:]+)(?::(\d+[\d,\s-]*))?\s*\]/g, (match, refPath, lineSpec) => {
          const trimmedPath = refPath.trim();
          if (!lineSpec) {
            return '<button type="button" class="citation-button" data-path="' + trimmedPath + '" data-lines="all">[' + trimmedPath + ']</button>';
          }
          const trimmedSpec = lineSpec.trim();
          return '<button type="button" class="citation-button" data-path="' + trimmedPath + '" data-lines="' + trimmedSpec + '">[' + trimmedPath + ':' + trimmedSpec + ']</button>';
        });
      }

      function renderSummary(structured, repo, test) {
        const segments = [
          { key: "verdict", label: "Verdict" },
          { key: "reason", label: "Reason" },
          { key: "evidence", label: "Evidence" },
        ];

        const available = segments.filter((segment) => structured[segment.key]);

        if (!available.length) {
          testSummary.hidden = true;
          testSummary.innerHTML = "";
          return;
        }

        testSummary.hidden = false;
        testSummary.innerHTML = available
          .map((segment) => {
            const source =
              segment.key === "evidence"
                ? decorateEvidenceMarkdown(structured[segment.key])
                : structured[segment.key];
            const html = DOMPurify.sanitize(marked.parse(source), sanitizeOptions);
            return '<div class="summary-card" data-section="' + segment.key + '">' +
                '<div class="summary-label">' + segment.label + '</div>' +
                '<div class="summary-body">' + html + '</div>' +
              '</div>';
          })
          .join("");

        attachEvidenceInteractions(repo, test);
      }

      function attachEvidenceInteractions(repo, test) {
        const evidenceCard = testSummary.querySelector('.summary-card[data-section="evidence"]');
        if (!evidenceCard) {
          return;
        }
        evidenceCard.querySelectorAll(".citation-button").forEach((button) => {
          button.addEventListener("click", (event) => handleCitationClick(event, repo, test));
        });
      }

      async function handleCitationClick(event, repo, test) {
        const button = event.currentTarget;
        if (button._snippetEl && button._snippetEl.isConnected) {
          button._snippetEl.remove();
          button._snippetEl = null;
          button.dataset.open = "false";
          return;
        }

        button.classList.add("loading");
        try {
          const path = button.dataset.path;
          const linesSpec = button.dataset.lines;
          const snippet = await loadCitationSnippet(repo, test, path, linesSpec);
          const snippetElement = document.createElement("div");
          snippetElement.className = "citation-snippet";
          const labelSpec = linesSpec === "all" ? "(full file)" : linesSpec;
          snippetElement.innerHTML =
            '<div class="snippet-meta">' + path + (linesSpec !== "all" ? ':' + labelSpec : ' ' + labelSpec) + '</div>' +
            '<pre><code>' + escapeHTML(snippet) + '</code></pre>';
          button.insertAdjacentElement("afterend", snippetElement);
          button._snippetEl = snippetElement;
          button.dataset.open = "true";
        } catch (error) {
          const snippetElement = document.createElement("div");
          snippetElement.className = "citation-snippet error";
          snippetElement.textContent = error.message || "Unable to load code snippet.";
          button.insertAdjacentElement("afterend", snippetElement);
          button._snippetEl = snippetElement;
          button.dataset.open = "true";
        } finally {
          button.classList.remove("loading");
        }
      }

      async function loadCitationSnippet(repo, test, path, linesSpec) {
        const cacheKey = repo.repo + "|" + (test?.metadata?.sample_id || "") + "|" + path + "|" + linesSpec;
        if (citationCache.has(cacheKey)) {
          return citationCache.get(cacheKey);
        }
        const fileContent = await fetchCitationContent(test, path);
        const snippet = extractSnippet(fileContent, linesSpec);
        citationCache.set(cacheKey, snippet);
        return snippet;
      }

      async function fetchCitationContent(test, citationPath) {
        const cleanedPath = citationPath.replace(/\\(.)/g, "$1").trim();
        if (cleanedPath.startsWith("/evidence/")) {
          return fetchEvidenceContent(test, cleanedPath);
        }
        if (cleanedPath.startsWith("/kaggle/")) {
          return fetchKaggleFile(cleanedPath);
        }
        if (cleanedPath.startsWith("/workspace/")) {
          return fetchWorkspaceFile(cleanedPath);
        }
        throw new Error("Unsupported citation path: " + citationPath);
      }

      async function fetchKaggleFile(citationPath) {
        // Handle paths like /kaggle/repo/pytorch-diabetic-retinopathy/file.py
        let normalized = citationPath.replace(/^\/+/, "");
        normalized = normalized.replace(/^kaggle\//, "");
        normalized = normalized.replace(/^repo\//, "");

        const segments = normalized.split("/");
        if (segments.length < 1) {
          throw new Error("Malformed Kaggle citation path.");
        }

        const repoFolder = segments[0];
        const fileParts = segments.slice(1);

        const candidates = repoPaths[repoFolder] || [];
        if (!candidates.length) {
          throw new Error("No local checkout found for " + repoFolder + ". Make sure repo-paths.json is available.");
        }
        let lastError = null;
        for (const root of candidates) {
          const candidatePath = fileParts.length ? root + "/" + fileParts.join("/") : root;
          try {
            return await fetchTextAsset(candidatePath);
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("Unable to load Kaggle file from local checkout.");
      }

      async function fetchWorkspaceFile(citationPath) {
        let normalized = citationPath.replace(/^\/+/, "");
        normalized = normalized.replace(/^workspace\//, "");

        const segments = normalized.split("/");
        if (segments.length < 1) {
          throw new Error("Malformed workspace citation path.");
        }

        const repoFolder = segments[0];
        const fileParts = segments.slice(1);

        const candidates = repoPaths[repoFolder] || [];
        if (!candidates.length) {
          throw new Error("No local checkout found for " + repoFolder + ".");
        }
        let lastError = null;
        for (const root of candidates) {
          const candidatePath = fileParts.length ? root + "/" + fileParts.join("/") : root;
          try {
            return await fetchTextAsset(candidatePath);
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("Unable to load workspace file from local checkout.");
      }

      async function fetchEvidenceContent(test, citationPath) {
        const bundles = test.evidenceBundles || [];
        if (!bundles.length) {
          throw new Error("No evidence archive recorded for this test.");
        }
        const normalized = citationPath.replace(/^\/+/, "");
        for (const bundlePath of bundles) {
          const files = await loadBundleFiles(bundlePath);
          if (files.has(normalized)) {
            return files.get(normalized);
          }
        }
        throw new Error("Citation not found inside evidence archives.");
      }

      async function loadBundleFiles(bundlePath) {
        if (bundleCache.has(bundlePath)) {
          return bundleCache.get(bundlePath);
        }
        if (!window.fflate) {
          throw new Error("Compression utilities are unavailable.");
        }
        const response = await fetch(buildAssetURL(bundlePath));
        if (!response.ok) {
          throw new Error("Unable to load " + bundlePath);
        }
        const buffer = new Uint8Array(await response.arrayBuffer());
        const decompressed = window.fflate.gunzipSync(buffer);
        const files = parseTarArchive(decompressed);
        bundleCache.set(bundlePath, files);
        return files;
      }

      async function fetchTextAsset(relativePath) {
        const response = await fetch(buildAssetURL(relativePath));
        if (!response.ok) {
          throw new Error("Unable to read " + relativePath);
        }
        return response.text();
      }

      function buildAssetURL(relativePath) {
        const encoded = relativePath
          .split("/")
          .filter(Boolean)
          .map((segment) => encodeURIComponent(segment))
          .join("/");
        return "../" + encoded;
      }

      function parseTarArchive(data) {
        const files = new Map();
        const BLOCK = 512;
        let offset = 0;
        while (offset + BLOCK <= data.length) {
          const name = readTarString(data, offset, 100);
          if (!name) {
            break;
          }
          const sizeOctal = readTarString(data, offset + 124, 12);
          const size = parseInt(sizeOctal || "0", 8) || 0;
          offset += BLOCK;
          const fileBytes = data.subarray(offset, offset + size);
          files.set(name, textDecoder.decode(fileBytes));
          offset += Math.ceil(size / BLOCK) * BLOCK;
        }
        return files;
      }

      function readTarString(data, start, length) {
        let result = "";
        for (let i = 0; i < length; i += 1) {
          const code = data[start + i];
          if (!code) {
            break;
          }
          result += String.fromCharCode(code);
        }
        return result.trim();
      }

      function getStructuredSections(test) {
        if (test.sections && (test.sections.verdict || test.sections.reason || test.sections.evidence)) {
          return test.sections;
        }
        return parseDescriptionSections(test.description || "");
      }

      function extractSnippet(content, linesSpec) {
        const lines = content.split(/\r?\n/);

        if (linesSpec === "all") {
          const digits = String(lines.length).length;
          return lines
            .map((line, index) => (String(index + 1).padStart(digits) + " | " + line))
            .join("\n");
        }

        const lineNumbers = [];
        const parts = linesSpec.split(/,/);

        for (const part of parts) {
          const trimmed = part.trim();
          if (trimmed.includes("-")) {
            const [startStr, endStr] = trimmed.split("-").map(s => s.trim());
            const start = parseInt(startStr, 10);
            const end = parseInt(endStr, 10);
            if (!isNaN(start) && !isNaN(end)) {
              for (let i = start; i <= end; i++) {
                lineNumbers.push(i);
              }
            }
          } else {
            const num = parseInt(trimmed, 10);
            if (!isNaN(num)) {
              lineNumbers.push(num);
            }
          }
        }

        if (!lineNumbers.length) {
          throw new Error("Invalid line specification: " + linesSpec);
        }

        const uniqueLines = [...new Set(lineNumbers)].sort((a, b) => a - b);
        const maxLine = Math.max(...uniqueLines);
        const digits = String(maxLine).length;

        const result = [];
        let lastLine = null;

        for (const lineNum of uniqueLines) {
          if (lineNum < 1 || lineNum > lines.length) {
            continue;
          }
          if (lastLine !== null && lineNum > lastLine + 1) {
            result.push("...");
          }
          result.push(String(lineNum).padStart(digits) + " | " + lines[lineNum - 1]);
          lastLine = lineNum;
        }

        if (!result.length) {
          throw new Error("Requested line range is empty in this file.");
        }

        return result.join("\n");
      }

      function escapeHTML(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderDetails() {
        const repos = getCurrentRepos();
        if (selectedRepoIndex === null || selectedTestIndex === null) {
          return;
        }

        const repo = repos[selectedRepoIndex];
        if (!repo) return;

        const test = repo.tests[selectedTestIndex];
        if (!test) return;

        selectedTestName.textContent = formatTestName(test, selectedTestIndex);
        const structured = getStructuredSections(test);
        renderSummary(structured, repo, test);
      }

      function updateFooter() {
        const log = getCurrentLog();
        if (log) {
          footer.textContent = "Data source: " + (log.path || log.name);
        }
      }

      function renderAll() {
        updateLogStats();
        renderRepos();
        renderTests();
        renderDetails();
        updateFooter();
      }

      async function loadRepoPaths() {
        try {
          const response = await fetch(REPO_PATHS_URL);
          repoPaths = response.ok ? await response.json() : {};
        } catch (error) {
          repoPaths = {};
          console.warn("Failed to load repo path manifest.", error);
        }
      }

      function sortTestsInLogs(logs) {
        // Sort tests within each repo by prop_index (extracted from sample_id if not present)
        for (const log of logs) {
          for (const repo of (log.repos || [])) {
            repo.tests.sort((a, b) => {
              // Use prop_index if available, otherwise extract from sample_id
              let indexA = a.metadata?.prop_index;
              let indexB = b.metadata?.prop_index;
              if (indexA === undefined) {
                indexA = extractPropIndexFromSampleId(a.metadata?.sample_id || "");
              }
              if (indexB === undefined) {
                indexB = extractPropIndexFromSampleId(b.metadata?.sample_id || "");
              }
              return indexA - indexB;
            });
          }
        }
        return logs;
      }

      async function loadPrecompiledData() {
        try {
          const response = await fetch(EVAL_DATA_URL);
          if (!response.ok) {
            return null;
          }
          const payload = await response.json();

          if (payload.logs && Array.isArray(payload.logs)) {
            return sortTestsInLogs(payload.logs);
          } else if (payload.repos && Array.isArray(payload.repos)) {
            return sortTestsInLogs([{
              name: "Default Log",
              path: "",
              repos: payload.repos,
            }]);
          }
          return null;
        } catch (error) {
          console.warn("Could not load precompiled data:", error);
          return null;
        }
      }

      async function loadData() {
        try {
          await loadRepoPaths();

          // Check URL params for direct .eval file paths
          const evalPaths = getEvalPathsFromUrl();

          if (evalPaths.length > 0) {
            // Load .eval files directly from URL params
            emptyState.textContent = "Loading .eval files...";
            const results = await Promise.all(
              evalPaths.map(path => fetchAndParseEvalUrl(path).catch(e => {
                console.error("Failed to load", path, e);
                return null;
              }))
            );
            logs = results.filter(Boolean);
            if (!logs.length) {
              throw new Error("No valid .eval files could be loaded from URL parameters.");
            }
          } else {
            // Try precompiled data first
            const precompiled = await loadPrecompiledData();
            if (precompiled) {
              logs = precompiled;
            } else {
              emptyState.textContent = "No data loaded. Use the file picker to open .eval files, or add ?eval=path/to/file.eval to the URL.";
              return;
            }
          }

          renderLogSelector();
          renderAll();
        } catch (error) {
          emptyState.textContent = "Unable to load results. Check the console for more details.";
          console.error(error);
        }
      }

      // File picker handler
      fileInput.addEventListener("change", async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        emptyState.textContent = "Loading " + files.length + " .eval file(s)...";
        logStats.textContent = "Loading...";

        try {
          const results = await Promise.all(
            files.map(file => parseEvalFile(file).catch(err => {
              console.error("Failed to parse", file.name, err);
              return null;
            }))
          );

          const validLogs = results.filter(Boolean);
          if (!validLogs.length) {
            emptyState.textContent = "No valid .eval files could be parsed.";
            return;
          }

          logs = validLogs;
          selectedLogIndex = 0;
          selectedRepoIndex = null;
          selectedTestIndex = null;

          renderLogSelector();
          renderAll();
        } catch (error) {
          emptyState.textContent = "Error loading files. Check the console.";
          console.error(error);
        }
      });

      loadData();
    </script>
  </body>
</html>
