<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibetest Results Viewer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #1f2328;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.5rem 2rem 1rem;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      main {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 1.5rem;
        padding: 0 2rem 2rem;
        flex: 1;
        min-height: 0;
      }

      aside,
      section {
        background: #fff;
        border-radius: 16px;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        overflow: hidden;
      }

      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #repo-list,
      #test-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        overflow-y: auto;
        padding-right: 0.25rem;
        flex: 1;
      }

      .list-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #5c6370;
        margin-bottom: 0.75rem;
      }

      button.list-item {
        border: 1px solid #dde2eb;
        background: #fff;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        text-align: left;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 120ms ease;
      }

      button.list-item:hover {
        border-color: #b9c3d8;
      }

      button.list-item.active {
        border-color: #2563eb;
        background: #e3ecff;
      }

      .repo-meta {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.45rem;
        font-size: 0.82rem;
        color: #6c7280;
      }

      .tests-pane {
        display: grid;
        grid-template-columns: minmax(240px, 320px) 1fr;
        height: 100%;
        gap: 1.25rem;
        min-height: 0;
      }

      .status-pill {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        background: #e5f6ef;
        color: #0e8054;
      }

      .status-pill.pass {
        background: #e5f6ef;
        color: #0e8054;
      }

      .status-pill.fail {
        background: #fde2e1;
        color: #c53030;
      }

      .status-pill.na {
        background: #fef3c7;
        color: #92400e;
      }

      .status-pill.inconclusive {
        background: #ede9fe;
        color: #5b21b6;
      }

      .status-pill.unknown {
        background: #e5e7eb;
        color: #4b5563;
      }

      .tests-column {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #test-details {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      #selected-test-name {
        margin: 0;
        font-size: 1.25rem;
      }

      #test-summary {
        margin-top: 1rem;
      }

      .summary-grid {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .summary-card {
        border: 1px solid #e3e8f0;
        border-radius: 12px;
        padding: 0.9rem;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-height: 0;
      }

      .summary-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c7280;
      }

      .summary-card p {
        margin: 0;
      }

      .summary-card p + p {
        margin-top: 0.5rem;
      }

      #empty-state {
        color: #6c7280;
        font-size: 0.9rem;
        margin: 0.5rem 0 0;
      }

      footer {
        padding: 0 2rem 2rem;
        font-size: 0.85rem;
        color: #8c92a3;
      }

      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
          min-height: 0;
        }

        .tests-pane {
          grid-template-columns: 1fr;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Agent Run Viewer</h1>
      <p>Explore GPT-5 Kaggle agent results and drill down into each test case.</p>
    </header>
    <main>
      <aside>
        <div class="list-label">Repositories</div>
        <div id="repo-list"></div>
      </aside>
      <section class="tests-pane">
        <div class="tests-column">
          <div class="list-label">Tests</div>
          <div id="test-list"></div>
          <p id="empty-state">Select a repository to view its tests.</p>
        </div>
        <div id="test-details">
          <h2 id="selected-test-name">Pick a test to see its reasoning</h2>
          <div id="test-summary" class="summary-grid" hidden></div>
        </div>
      </section>
    </main>
    <footer>Data source: results/kaggle_results_gpt-5.jsonl</footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
      const repoList = document.getElementById("repo-list");
      const testList = document.getElementById("test-list");
      const emptyState = document.getElementById("empty-state");
      const selectedTestName = document.getElementById("selected-test-name");
      const testSummary = document.getElementById("test-summary");

      let repos = [];
      let selectedRepoIndex = null;
      let selectedTestIndex = null;

      function formatTestName(test, index) {
        return (
          test?.metadata?.test_description ||
          test?.metadata?.name ||
          `Test ${index + 1}`
        );
      }

      function parseDescriptionSections(description) {
        const lines = (description || "").split(/\r?\n/);
        const sectionMap = {
          VERDICT: "verdict",
          REASON: "reason",
          EVIDENCE: "evidence",
        };
        const buffers = {
          verdict: [],
          reason: [],
          evidence: [],
        };
        let current = null;

        lines.forEach((line) => {
          const match = line.match(/^([A-Z ]+):\s*(.*)$/);
          if (match && sectionMap[match[1]]) {
            current = sectionMap[match[1]];
            if (match[2]) {
              buffers[current].push(match[2]);
            }
            return;
          }
          if (current) {
            buffers[current].push(line);
          }
        });

        return {
          verdict: buffers.verdict.join("\n").trim(),
          reason: buffers.reason.join("\n").trim(),
          evidence: buffers.evidence.join("\n").trim(),
        };
      }

      function determineStatus(structured, fallbackPassed) {
        const rawVerdict = (structured.verdict || "")
          .split(/\n/)[0]
          .trim()
          .toUpperCase();

        const verdictMap = [
          { matcher: (text) => text.startsWith("PASS"), label: "Pass", className: "pass" },
          { matcher: (text) => text.startsWith("FAIL"), label: "Fail", className: "fail" },
          {
            matcher: (text) => text.startsWith("NA") || text.includes("NOT APPLICABLE"),
            label: "N/A",
            className: "na",
          },
          {
            matcher: (text) => text.startsWith("INCONCLUSIVE"),
            label: "Inconclusive",
            className: "inconclusive",
          },
        ];

        if (rawVerdict) {
          const hit = verdictMap.find((entry) => entry.matcher(rawVerdict));
          if (hit) {
            return hit;
          }
        }

        if (fallbackPassed === true) {
          return { label: "Pass", className: "pass" };
        }
        if (fallbackPassed === false) {
          return { label: "Fail", className: "fail" };
        }
        return { label: "Unknown", className: "unknown" };
      }

      function renderRepos() {
        repoList.innerHTML = "";
        repos.forEach((repo, index) => {
          const button = document.createElement("button");
          button.className = "list-item" + (selectedRepoIndex === index ? " active" : "");
          button.innerHTML = `
            <div>${repo.repo_name || repo.repo}</div>
            <div class="repo-meta">
              <span>${repo.total_tests} tests</span>
              <span>${repo.passed_tests} ✓ / ${repo.failed_tests} ✕</span>
            </div>
          `;
          button.addEventListener("click", () => {
            selectedRepoIndex = index;
            selectedTestIndex = null;
            renderRepos();
            renderTests();
          });
          repoList.appendChild(button);
        });
      }

      function renderTests() {
        testList.innerHTML = "";
        if (selectedRepoIndex === null) {
          emptyState.textContent = "Select a repository to view its tests.";
          selectedTestName.textContent = "Pick a test to see its reasoning";
          testSummary.hidden = true;
          testSummary.innerHTML = "";
          return;
        }

        const repo = repos[selectedRepoIndex];
        emptyState.textContent = repo.tests.length
          ? "Select a test to inspect its markdown reasoning."
          : "This repository has no recorded tests.";

        repo.tests.forEach((test, index) => {
          const structured = parseDescriptionSections(test.description);
          const status = determineStatus(structured, test.passed);
          const button = document.createElement("button");
          button.className = "list-item" + (selectedTestIndex === index ? " active" : "");
          button.innerHTML = `
            <div>${formatTestName(test, index)}</div>
            <div class="repo-meta">
              <span class="status-pill ${status.className}">${status.label}</span>
              <span>${test?.metadata?.model || "Unknown model"}</span>
            </div>
          `;
          button.addEventListener("click", () => {
            selectedTestIndex = index;
            renderTests();
            renderDetails();
          });
          testList.appendChild(button);
        });

        if (selectedTestIndex === null) {
          selectedTestName.textContent = "Pick a test to see its reasoning";
          testSummary.hidden = true;
          testSummary.innerHTML = "";
        }
      }

      function renderSummary(structured) {
        const segments = [
          { key: "verdict", label: "Verdict" },
          { key: "reason", label: "Reason" },
          { key: "evidence", label: "Evidence" },
        ];

        const available = segments.filter((segment) => structured[segment.key]);

        if (!available.length) {
          testSummary.hidden = true;
          testSummary.innerHTML = "";
          return;
        }

        testSummary.hidden = false;
        testSummary.innerHTML = available
          .map((segment) => {
            const html = DOMPurify.sanitize(marked.parse(structured[segment.key]));
            return `
              <div class="summary-card">
                <div class="summary-label">${segment.label}</div>
                <div class="summary-body">${html}</div>
              </div>
            `;
          })
          .join("");
      }

      function renderDetails() {
        if (selectedRepoIndex === null || selectedTestIndex === null) {
          return;
        }

        const test = repos[selectedRepoIndex].tests[selectedTestIndex];
        selectedTestName.textContent = formatTestName(test, selectedTestIndex);
        const structured = parseDescriptionSections(test.description);
        renderSummary(structured);
      }

      async function loadData() {
        try {
          const response = await fetch("../results/kaggle_results_gpt-5.jsonl");
          if (!response.ok) {
            throw new Error(`Failed to load data (${response.status})`);
          }
          const text = await response.text();
          repos = text
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => {
              try {
                return JSON.parse(line);
              } catch (error) {
                console.error("Could not parse line:", line, error);
                return null;
              }
            })
            .filter(Boolean);
          renderRepos();
          renderTests();
        } catch (error) {
          emptyState.textContent = "Unable to load results. Check the console for more details.";
          console.error(error);
        }
      }

      loadData();
    </script>
  </body>
</html>
